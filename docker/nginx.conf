server {
    listen 80;
    server_name _;
    root /var/www/html/public;
    index index.php;

    client_max_body_size 32m;

    # Ảnh sản phẩm / ảnh vận đơn nằm trong volume om-storage.
    # Trỏ alias thẳng vào đó nên KHÔNG cần `artisan storage:link`
    # (symlink trong container app không nhìn thấy được từ container nginx).
    location /storage/ {
        alias /var/www/html/storage/app/public/;
        access_log off;
        expires 7d;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass om-app:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        # Nginx của host đã terminate TLS. Báo cho PHP biết để Laravel
        # sinh URL https thay vì http.
        fastcgi_param HTTPS on;
        fastcgi_read_timeout 120s;
    }

    location ~ /\.(?!well-known) { deny all; }
}
